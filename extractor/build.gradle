plugins { id 'java-library'; id 'com.google.protobuf' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
sourceSets.main {
    java.srcDir '../.deps/NewPipeExtractor/extractor/src/main/java'
    java.srcDir '../.deps/NewPipeExtractor/timeago-parser/src/main/java'
    proto.srcDirs = ['../.deps/NewPipeExtractor/extractor/src/main/proto']
    resources.srcDirs = ['../.deps/NewPipeExtractor/extractor/src/main/resources']
}
dependencies {
    api project(':nanojson')
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.36.2'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
}
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.36.2' }
    generateProtoTasks { all().configureEach { builtins { java { option 'lite' } } } }
}
